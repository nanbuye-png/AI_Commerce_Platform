name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commerce-core:
    name: Commerce Core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend tests
        run: mvn --batch-mode --no-transfer-progress -f backend/commerce-platform/pom.xml test

  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app:
          - customer-web
          - merchant-web
          - admin-web
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Customer unit tests
        if: matrix.app == 'customer-web'
        run: npm test

  ai-service:
    name: AI Service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run tests
        run: python -m pytest

  ai-eval:
    name: AI Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install evaluation dependencies
        working-directory: ai-service
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run deterministic evaluation
        working-directory: ai-service
        run: python evals/run_eval.py --json-output /tmp/ai-eval.json --markdown-output /tmp/ai-eval.md
      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: ai-evaluation-report
          path: |
            /tmp/ai-eval.json
            /tmp/ai-eval.md

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/customer-web/package-lock.json
      - name: Install customer dependencies
        working-directory: frontend/customer-web
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend/customer-web
        run: npx playwright install --with-deps chromium
      - name: Start demo stack
        run: docker compose up --build -d
      - name: Wait for demo stack
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=100
          exit 1
      - name: Run Playwright
        working-directory: frontend/customer-web
        env:
          CI: true
        run: npm run e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            frontend/customer-web/playwright-report
            frontend/customer-web/test-results
          if-no-files-found: ignore
      - name: Stop demo stack
        if: always()
        run: docker compose down -v
