services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  commerce-core:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_CUSTOMER_WEB_SECRET: ${JWT_CUSTOMER_WEB_SECRET:?JWT_CUSTOMER_WEB_SECRET is required}
      JWT_MERCHANT_WEB_SECRET: ${JWT_MERCHANT_WEB_SECRET:?JWT_MERCHANT_WEB_SECRET is required}
      JWT_ADMIN_WEB_SECRET: ${JWT_ADMIN_WEB_SECRET:?JWT_ADMIN_WEB_SECRET is required}
      AI_INTERNAL_API_TOKEN: ${AI_INTERNAL_API_TOKEN:?AI_INTERNAL_API_TOKEN is required}
      DEMO_SEED_ENABLED: "false"
      ALLOW_ADMIN_SELF_REGISTER: "false"
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      CORS_ALLOWED_ORIGINS: http://47.80.61.59:5173,http://47.80.61.59:5174,http://47.80.61.59:5175

  ai-service:
    environment:
      AI_INTERNAL_API_TOKEN: ${AI_INTERNAL_API_TOKEN:?AI_INTERNAL_API_TOKEN is required}
