server:
  port: 8080

spring:
  application:
    name: ai-commerce-platform
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_commerce_platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    validate-migration-naming: true

# JWT
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}
  customer-web-secret: ${JWT_CUSTOMER_WEB_SECRET:}
  merchant-web-secret: ${JWT_MERCHANT_WEB_SECRET:}
  admin-web-secret: ${JWT_ADMIN_WEB_SECRET:}

app:
  security:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:admin123}
    admin-email: ${ADMIN_EMAIL:admin@example.com}
    allow-admin-self-register: ${ALLOW_ADMIN_SELF_REGISTER:false}
  ai:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    internal-token: ${AI_INTERNAL_API_TOKEN:}
    connect-timeout: ${AI_CONNECT_TIMEOUT:3s}
    request-timeout: ${AI_REQUEST_TIMEOUT:60s}
