server:
  port: 8080

spring:
  application:
    name: ai-commerce-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_commerce
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false

# JWT
jwt:
  secret: ai-commerce-platform-secret-key-change-in-production
  expiration: 86400000
  customer-web-secret: customer-web-jwt-secret-change-in-production
  merchant-web-secret: merchant-web-jwt-secret-change-in-production
  admin-web-secret: admin-web-jwt-secret-change-in-production