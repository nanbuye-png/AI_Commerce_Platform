spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_commerce_platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

jwt:
  # 本地开发也从未提交的 .env 读取密钥，避免仓库内出现可复用凭据。
  secret: ${JWT_SECRET:}
  customer-web-secret: ${JWT_CUSTOMER_WEB_SECRET:}
  merchant-web-secret: ${JWT_MERCHANT_WEB_SECRET:}
  admin-web-secret: ${JWT_ADMIN_WEB_SECRET:}
