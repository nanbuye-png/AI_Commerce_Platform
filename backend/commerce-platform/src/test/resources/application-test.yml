spring:
  datasource:
    url: jdbc:h2:mem:ai_commerce_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false
  task:
    scheduling:
      enabled: false

jwt:
  secret: test-only-ai-commerce-jwt-secret-at-least-32-characters
  expiration: 3600000
  customer-web-secret: test-only-customer-web-secret-at-least-32-characters
  merchant-web-secret: test-only-merchant-web-secret-at-least-32-characters
  admin-web-secret: test-only-admin-web-secret-at-least-32-characters

logging:
  level:
    root: WARN
    com.commerce.platform: INFO