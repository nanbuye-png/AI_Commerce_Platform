services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_commerce_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-postgres-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_commerce_platform"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  commerce-core:
    build:
      context: ./backend/commerce-platform
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:postgresql://postgres:5432/ai_commerce_platform
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-demo-postgres-password}
      JWT_CUSTOMER_WEB_SECRET: ${JWT_CUSTOMER_WEB_SECRET:-demo-customer-secret-at-least-32-characters}
      JWT_MERCHANT_WEB_SECRET: ${JWT_MERCHANT_WEB_SECRET:-demo-merchant-secret-at-least-32-characters}
      JWT_ADMIN_WEB_SECRET: ${JWT_ADMIN_WEB_SECRET:-demo-admin-secret-at-least-32-characters}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      AI_INTERNAL_API_TOKEN: ${AI_INTERNAL_API_TOKEN:-demo-internal-token-at-least-32-characters}
      DEMO_SEED_ENABLED: "true"
      ADMIN_USERNAME: demo_admin
      ADMIN_PASSWORD: Demo123!
      ADMIN_EMAIL: admin@demo.local
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
    environment:
      AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-mock}
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-mock-commerce-assistant}
      AI_LLM_BASE_URL: ${AI_LLM_BASE_URL:-https://api.openai.com/v1}
      AI_LLM_API_KEY: ${AI_LLM_API_KEY:-}
      AI_INTERNAL_API_TOKEN: ${AI_INTERNAL_API_TOKEN:-demo-internal-token-at-least-32-characters}
      COMMERCE_CORE_BASE_URL: http://commerce-core:8080
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  customer-web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        APP_NAME: customer-web
        VITE_API_BASE_URL: "/"
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      commerce-core:
        condition: service_healthy
    restart: unless-stopped

  merchant-web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        APP_NAME: merchant-web
        VITE_API_BASE_URL: "/"
    ports:
      - "127.0.0.1:5174:80"
    depends_on:
      commerce-core:
        condition: service_healthy
    restart: unless-stopped

  admin-web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        APP_NAME: admin-web
        VITE_API_BASE_URL: "/"
    ports:
      - "127.0.0.1:5175:80"
    depends_on:
      commerce-core:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  uploads-data:
